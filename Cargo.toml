[package]
name = "ben_os"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader = "0.9.23"
linked_list_allocator = "0.10"
spin = "0.9"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "ben_os"
test = false
bench = false

[build-dependencies]
cc = "1"

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]